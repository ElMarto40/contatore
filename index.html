:root {
  --bg: #E4E8EC;
  --ink: #161B26;
  --muted: #5B6472;
  --simone: #2350F5;
  --monica: #E62E5C;
  --tile-top: #222838;
  --tile-bot: #1A1F2C;
  --tile-ink: #F4F6FA;
  --danger: #C21D45;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #12151C; --ink: #EDF0F5; --muted: #98A1AF; --danger: #FF6B8A; }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: "Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

main {
  min-height: 100%;
  min-height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding:
    max(24px, env(safe-area-inset-top))
    max(18px, env(safe-area-inset-right))
    max(18px, env(safe-area-inset-bottom))
    max(18px, env(safe-area-inset-left));
}

h1 {
  margin: 0;
  font-family: "Display", system-ui, sans-serif;
  font-weight: 900;
  font-size: clamp(46px, 15vw, 76px);
  line-height: .86;
  letter-spacing: -.005em;
}
h1 span { display: block; }

.status {
  margin: 14px 0 0;
  min-height: 1.35em;
  font-size: 18px;
  font-weight: 500;
  line-height: 1.35;
  color: var(--muted);
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.status[data-lead] { color: var(--ink); font-weight: 700; }
.status[data-lead]::before {
  content: "";
  flex: none;
  width: 10px; height: 10px;
  border-radius: 50%;
  transform: translateY(-1px);
  background: var(--lead);
}
.status[data-lead="s"] { --lead: var(--simone); }
.status[data-lead="m"] { --lead: var(--monica); }

.players {
  flex: 1 1 auto;
  min-height: 270px;
  max-height: 420px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.player {
  container-type: inline-size;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-start;
  padding: 14px;
  border: 0;
  border-radius: 28px;
  background: var(--c);
  color: #fff;
  font: inherit;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: transform .12s ease, filter .12s ease;
}
.player:active { transform: scale(.965); filter: brightness(.94); }
.player:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
#btn-s { --c: var(--simone); }
#btn-m { --c: var(--monica); }

.plus {
  align-self: flex-end;
  display: grid;
  place-items: center;
  width: 46px; height: 46px;
  border-radius: 50%;
  background: #fff;
  color: var(--c);
}
.plus svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; }

.name {
  font-family: "Display", system-ui, sans-serif;
  font-weight: 800;
  font-size: clamp(30px, 22cqw, 46px);
  line-height: 1;
  padding-left: 2px;
}
.score { display: flex; flex-direction: column; gap: 12px; }

/* Split-flap scoreboard */
.board { display: flex; gap: 5px; }
.tile {
  --tw: min(84px, calc((100cqw - 28px - (var(--n, 2) - 1) * 5px) / var(--n, 2)));
  --th: calc(var(--tw) * 1.42);
  position: relative;
  width: var(--tw);
  height: var(--th);
  perspective: 400px;
  font-family: "Display", system-ui, sans-serif;
  font-weight: 800;
  font-size: calc(var(--tw) * 1.22);
  color: var(--tile-ink);
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.half {
  position: absolute;
  left: 0; right: 0;
  height: 50%;
  overflow: hidden;
  backface-visibility: hidden;
}
.half.top { top: 0; background: var(--tile-top); border-radius: 10px 10px 0 0; }
.half.bot { bottom: 0; background: var(--tile-bot); border-radius: 0 0 10px 10px; }
.half > span {
  position: absolute;
  left: 0; right: 0;
  height: var(--th);
  line-height: var(--th);
  padding-top: calc(var(--th) * .035);
}
.half.top > span { top: 0; }
.half.bot > span { bottom: 0; }
.tile::after {
  content: "";
  position: absolute;
  left: 0; right: 0;
  top: calc(50% - 1px);
  height: 2px;
  background: var(--c);
  opacity: .55;
  z-index: 4;
}
.flip { z-index: 3; }
.flip.top { transform-origin: 50% 100%; animation: fold-top .16s ease-in forwards; }
.flip.bot { transform-origin: 50% 0; transform: rotateX(90deg); animation: fold-bot .2s cubic-bezier(.2,.9,.3,1.25) .16s forwards; }
@keyframes fold-top { to { transform: rotateX(-90deg); } }
@keyframes fold-bot { from { transform: rotateX(90deg); } to { transform: rotateX(0); } }

.pop {
  position: absolute;
  top: 16px; right: 64px;
  font-family: "Display", system-ui, sans-serif;
  font-weight: 900;
  font-size: 30px;
  color: #fff;
  pointer-events: none;
  animation: pop .6s ease-out forwards;
}
@keyframes pop {
  from { opacity: 1; transform: translateY(6px) scale(.8); }
  to { opacity: 0; transform: translateY(-34px) scale(1.1); }
}

.controls { display: flex; justify-content: space-between; gap: 8px; margin: -6px -12px 0; }
.ghost {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 10px 12px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  color: var(--ink);
  font: 700 16px/1.2 "Text", system-ui, sans-serif;
  cursor: pointer;
  touch-action: manipulation;
}
.ghost svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.ghost:disabled { opacity: .32; cursor: default; }
.ghost:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.ghost[data-armed] { color: var(--danger); }

footer {
  margin-top: auto;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
  color: var(--muted);
}

@media (prefers-reduced-motion: reduce) {
  .player { transition: none; }
  .flip, .pop { display: none; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1><span>Contatore</span> <span>vincitore</span> <span>scommesse</span></h1>
    <p id="status" class="status" aria-live="polite"></p>
  </header>

  <section class="players" aria-label="Segna chi ha vinto">
    <button class="player" id="btn-s" data-key="s" type="button">
      <span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      <span class="score"><span class="board" id="board-s" aria-hidden="true"></span><span class="name">Simone</span></span>
    </button>
    <button class="player" id="btn-m" data-key="m" type="button">
      <span class="plus" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      <span class="score"><span class="board" id="board-m" aria-hidden="true"></span><span class="name">Monica</span></span>
    </button>
  </section>

  <div class="controls">
    <button id="undo" class="ghost" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      Annulla ultimo punto
    </button>
    <button id="reset" class="ghost" type="button">Azzera</button>
  </div>

  <footer>Il gioco crea dipendenza, se hai problemi parlarne con l'HR</footer>
</main>

<script>
(() => {
  const KEY = "contatore-scommesse-v1";
  const NAMES = { s: "Simone", m: "Monica" };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let state = { s: 0, m: 0, log: [] };

  const $ = (id) => document.getElementById(id);
  const boards = { s: $("board-s"), m: $("board-m") };
  const buttons = { s: $("btn-s"), m: $("btn-m") };
  const statusEl = $("status");
  const undoBtn = $("undo");
  const resetBtn = $("reset");
  const shown = { s: null, m: null };

  const count = (v) => (Number.isInteger(v) && v >= 0 ? v : 0);

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      state = {
        s: count(d.s),
        m: count(d.m),
        log: Array.isArray(d.log) ? d.log.filter((k) => k === "s" || k === "m").slice(-300) : [],
      };
    } catch (e) { /* storage not available: start from zero */ }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function tile(ch) {
    const t = document.createElement("span");
    t.className = "tile";
    t.innerHTML = '<span class="half top"><span></span></span><span class="half bot"><span></span></span>';
    t.querySelector(".top span").textContent = ch;
    t.querySelector(".bot span").textContent = ch;
    return t;
  }

  function flip(t, from, to) {
    t.querySelectorAll(".flip").forEach((f) => f.remove());
    const top = t.querySelector(".half.top:not(.flip) span");
    const bot = t.querySelector(".half.bot:not(.flip) span");
    top.textContent = to;
    bot.textContent = from;
    const ft = document.createElement("span");
    ft.className = "half top flip";
    ft.innerHTML = "<span></span>";
    ft.firstChild.textContent = from;
    const fb = document.createElement("span");
    fb.className = "half bot flip";
    fb.innerHTML = "<span></span>";
    fb.firstChild.textContent = to;
    t.append(ft, fb);
    fb.addEventListener("animationend", () => {
      bot.textContent = to;
      ft.remove();
      fb.remove();
    }, { once: true });
  }

  function renderBoard(key, animate) {
    const board = boards[key];
    // Both boards use the same number of digits so the numbers stay the same size.
    const width = Math.max(2, String(state.s).length, String(state.m).length);
    const next = String(state[key]).padStart(width, "0");
    const prev = shown[key];
    board.style.setProperty("--n", next.length);
    if (!animate || reduced || prev === null || prev.length !== next.length) {
      board.replaceChildren(...[...next].map(tile));
    } else {
      [...next].forEach((ch, i) => { if (ch !== prev[i]) flip(board.children[i], prev[i], ch); });
    }
    shown[key] = next;
    const v = state[key];
    buttons[key].setAttribute("aria-label",
      `${NAMES[key]}: ${v} ${v === 1 ? "vittoria" : "vittorie"}. Tocca per aggiungere una vittoria.`);
  }

  function renderStatus() {
    const { s, m } = state;
    if (s === m) {
      delete statusEl.dataset.lead;
      statusEl.textContent = s === 0
        ? "Tocca chi ha vinto la scommessa per dargli un punto."
        : `Parità, ${s} a ${m}.`;
    } else {
      const lead = s > m ? "s" : "m";
      statusEl.dataset.lead = lead;
      statusEl.textContent = `${NAMES[lead]} è in vantaggio di ${Math.abs(s - m)}.`;
    }
    undoBtn.disabled = state.log.length === 0;
    resetBtn.disabled = s === 0 && m === 0 && !resetBtn.dataset.armed;
  }

  function render(animate) {
    renderBoard("s", animate);
    renderBoard("m", animate);
    renderStatus();
  }

  function pop(btn) {
    if (reduced) return;
    const p = document.createElement("span");
    p.className = "pop";
    p.textContent = "+1";
    p.setAttribute("aria-hidden", "true");
    btn.append(p);
    p.addEventListener("animationend", () => p.remove(), { once: true });
  }

  function add(key) {
    state[key] += 1;
    state.log.push(key);
    if (state.log.length > 300) state.log.shift();
    save();
    render(true);
    pop(buttons[key]);
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
  }

  function undo() {
    const key = state.log.pop();
    if (!key) return;
    state[key] = Math.max(0, state[key] - 1);
    save();
    render(true);
  }

  let armTimer = 0;
  function disarm() {
    clearTimeout(armTimer);
    delete resetBtn.dataset.armed;
    resetBtn.textContent = "Azzera";
    renderStatus();
  }

  buttons.s.addEventListener("click", () => add("s"));
  buttons.m.addEventListener("click", () => add("m"));
  undoBtn.addEventListener("click", undo);
  resetBtn.addEventListener("click", () => {
    if (resetBtn.dataset.armed) {
      state = { s: 0, m: 0, log: [] };
      save();
      disarm();
      render(true);
    } else {
      resetBtn.dataset.armed = "1";
      resetBtn.textContent = "Tocca ancora per azzerare";
      armTimer = setTimeout(disarm, 3500);
    }
  });

  window.addEventListener("storage", (e) => {
    if (e.key === KEY) { load(); render(true); }
  });

  load();
  render(false);

  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  try {
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  } catch (e) {}
})();
</script>
</body>
</html>
